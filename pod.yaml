apiVersion: v1
kind: Pod
metadata:
  name: synthrad-paired-train-pod
spec:
  containers:
  - name: synthrad-paired-training
    image: nvcr.io/nvidia/pytorch:23.10-py3
    imagePullPolicy: IfNotPresent

    env:
    - name: REPO_PATH
      value: /opt/repo/synthrad2025-mri-ct

    command:
    - "bash"
    - "-c"
    - |
      echo "Checking GPU..."
      nvidia-smi

      echo "Setting up Git repository..."
      mkdir -p /opt/repo
      cd /opt/repo

      if [ -d "synthrad2025-mri-ct" ]; then
        echo "Repo already exists, pulling latest..."
        cd synthrad2025-mri-ct
        git pull origin main
      else
        echo "Cloning repo..."
        git clone --single-branch -b main \
          https://github.com/Deb-bie/synthrad2025-mri-ct.git \
          synthrad2025-mri-ct
        cd synthrad2025-mri-ct
      fi

      echo "Installing Python dependencies..."
      pip install -q \
        numpy==1.24.3 \
        pandas==2.0.3 \
        SimpleITK==2.3.1 \
        opencv-python-headless \
        torchmetrics \
        tqdm \
        matplotlib \
        scipy \
        psutil

      echo "Creating result directories..."
      mkdir -p /data/results/checkpoints/pix2pix/AB/mr2ct
      mkdir -p /data/results/checkpoints/pix2pix/AB/ct2mr
      mkdir -p /data/results/checkpoints/pix2pix/TH/mr2ct
      mkdir -p /data/results/checkpoints/pix2pix/TH/ct2mr
      mkdir -p /data/results/checkpoints/pix2pix/HN/mr2ct
      mkdir -p /data/results/checkpoints/pix2pix/HN/ct2mr
      mkdir -p /data/results/checkpoints/paired_cyclegan/AB
      mkdir -p /data/results/checkpoints/paired_cyclegan/TH
      mkdir -p /data/results/checkpoints/paired_cyclegan/HN
      mkdir -p /data/results/checkpoints/ablation_no_paired_l1/AB
      mkdir -p /data/results/checkpoints/ablation_separate_generators/AB
      mkdir -p /data/results/checkpoints/ablation_no_cycle/AB
      mkdir -p /data/results/logs/pix2pix
      mkdir -p /data/results/logs/paired_cyclegan
      mkdir -p /data/results/logs/ablations
      mkdir -p /data/results/metrics
      mkdir -p /data/results/figures

      echo "============================================"
      echo "Pod is ready."
      echo "  Code:    /opt/repo/synthrad2025-mri-ct"
      echo "  Data:    /data/Task1"
      echo "  Results: /data/results"
      echo "============================================"

      sleep infinity

    volumeMounts:
    - name: git-volume
      mountPath: /opt/repo
    - name: synthrad-data-volume
      mountPath: /data

    resources:
      limits:
        memory: 30Gi
        cpu: "16"
        nvidia.com/gpu: "1"
        ephemeral-storage: 50Gi
      requests:
        memory: 24Gi
        cpu: "12"
        nvidia.com/gpu: "1"
        ephemeral-storage: 20Gi

  volumes:
  - name: git-volume
    emptyDir: {}
  - name: synthrad-data-volume
    persistentVolumeClaim:
      claimName: synthrad-paired-train-data

  restartPolicy: Never