apiVersion: batch/v1
kind: Job
metadata:
  name: paired-cyclegan-ab
  namespace: your-namespace
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: OnFailure
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-A100-SXM4-40GB
                - NVIDIA-GeForce-RTX-3090
                - Tesla-V100-SXM2-32GB
      containers:
      - name: training
        image: yourdockerhubusername/synthrad-training:latest
        imagePullPolicy: Always
        command:
          - python
          - src/train_paired_cyclegan.py
          - --anatomy
          - AB
          - --data_root
          - /data/Task1
          - --split_dir
          - /data/splits
          - --config
          - /data/config.json
          - --output_dir
          - /results
        resources:
          limits:
            memory: "32Gi"
            cpu: "8"
            nvidia.com/gpu: "1"
          requests:
            memory: "16Gi"
            cpu: "4"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: data-volume
          mountPath: /data
        - name: results-volume
          mountPath: /results
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: synthrad-data
      - name: results-volume
        persistentVolumeClaim:
          claimName: synthrad-results