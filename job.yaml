apiVersion: batch/v1
kind: Job
metadata:
  name: synthrad-paired-train-job
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-A100-SXM4-80GB
                - NVIDIA-A100-SXM4-40GB
                - NVIDIA-A6000
                - NVIDIA-RTX-A6000
                - NVIDIA-GeForce-RTX-3090
                - NVIDIA-GeForce-RTX-2080-Ti
      containers:
      - name: synthrad-paired-training
        image: nvcr.io/nvidia/pytorch:23.10-py3
        imagePullPolicy: IfNotPresent

        env:
        - name: REPO_PATH
          value: /opt/repo/synthrad2025-mri-ct

        command:
        - "bash"
        - "-c"
        - |
          echo "Checking GPU..."
          nvidia-smi

          mkdir -p /opt/repo && cd /opt/repo

          if [ -d "synthrad2025-mri-ct" ]; then
            cd synthrad2025-mri-ct && git pull origin main
          else
            git clone --single-branch -b main \
              https://github.com/Deb-bie/synthrad2025-mri-ct.git \
              synthrad2025-mri-ct
            cd synthrad2025-mri-ct
          fi

          pip install -q \
            numpy==1.24.3 \
            pandas==2.0.3 \
            SimpleITK==2.3.1 \
            opencv-python-headless \
            torchmetrics \
            tqdm \
            matplotlib \
            scipy \
            psutil \
            scikit-image \
            torchvision

          mkdir -p /data/results/checkpoints/paired_cyclegan/AB
          mkdir -p /data/results/checkpoints/paired_cyclegan/TH
          mkdir -p /data/results/checkpoints/paired_cyclegan/HN
          mkdir -p /data/results/logs/paired_cyclegan

          cd /opt/repo/synthrad2025-mri-ct
          export PYTHONPATH=/opt/repo/synthrad2025-mri-ct

          echo "========================================" \
            >> /data/results/logs/paired_cyclegan/training_all.log
          echo "Starting AB training at $(date)" \
            >> /data/results/logs/paired_cyclegan/training_all.log

          python src/train_paired_cyclegan.py \
            --anatomy AB \
            --data_root /data/Task1 \
            --split_dir /data/splits \
            --config /data/config.json \
            --output_dir /data/results \
            >> /data/results/logs/paired_cyclegan/paired_cyclegan_AB.log 2>&1

          echo "AB finished at $(date)" \
            >> /data/results/logs/paired_cyclegan/training_all.log

          echo "Starting TH training at $(date)" \
            >> /data/results/logs/paired_cyclegan/training_all.log

          python src/train_paired_cyclegan.py \
            --anatomy TH \
            --data_root /data/Task1 \
            --split_dir /data/splits \
            --config /data/config.json \
            --output_dir /data/results \
            >> /data/results/logs/paired_cyclegan/paired_cyclegan_TH.log 2>&1

          echo "TH finished at $(date)" \
            >> /data/results/logs/paired_cyclegan/training_all.log

          echo "Starting HN training at $(date)" \
            >> /data/results/logs/paired_cyclegan/training_all.log

          python src/train_paired_cyclegan.py \
            --anatomy HN \
            --data_root /data/Task1 \
            --split_dir /data/splits \
            --config /data/config.json \
            --output_dir /data/results \
            >> /data/results/logs/paired_cyclegan/paired_cyclegan_HN.log 2>&1

          echo "HN finished at $(date). All training complete." \
            >> /data/results/logs/paired_cyclegan/training_all.log

        volumeMounts:
        - name: git-volume
          mountPath: /opt/repo
        - name: synthrad-data-volume
          mountPath: /data

        resources:
          limits:
            memory: 128Gi
            cpu: "16"
            nvidia.com/gpu: "1"
            ephemeral-storage: 50Gi
          requests:
            memory: 64Gi
            cpu: "12"
            nvidia.com/gpu: "1"
            ephemeral-storage: 20Gi

      volumes:
      - name: git-volume
        emptyDir: {}
      - name: synthrad-data-volume
        persistentVolumeClaim:
          claimName: synthrad-paired-train-data